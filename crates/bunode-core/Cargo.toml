[package]
name = "bunode-core"
description = "Bunode's process-management core: the Supervisor and everything it needs. Knows nothing about the UI or the FFI layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "net", "sync", "time", "macros"] }
vte = "0.15"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
