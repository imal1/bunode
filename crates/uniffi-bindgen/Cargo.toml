[package]
name = "uniffi-bindgen"
description = "Build tool: generates the Swift bindings for bunode-ffi. Pinned to the workspace's UniFFI version."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
