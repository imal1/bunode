# XcodeGen spec. `make project` turns it into Bunode.xcodeproj, which is not
# committed. Build the XCFramework first (`make xcframework`).
name: Bunode

options:
  bundleIdPrefix: io.github.imal1
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # Development builds are signed ad hoc ("Sign to Run Locally"), so no
    # Apple developer account is needed. Notarized releases come later.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"

targets:
  Bunode:
    type: application
    platform: macOS
    sources:
      - path: Bunode
      # Generated by scripts/build-xcframework.sh.
      - path: ../build/ffi/swift
        name: Generated
        group: Bunode
    dependencies:
      # Static library: linked, never embedded.
      - framework: ../build/BunodeFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Bunode
        PRODUCT_BUNDLE_IDENTIFIER: io.github.imal1.Bunode
        GENERATE_INFOPLIST_FILE: "YES"
        # Agent app: no Dock icon and no app menu bar (ADR-0004).
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Bunode
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 imal1. MIT License."
    scheme:
      testTargets:
        - BunodeTests

  BunodeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BunodeTests
    dependencies:
      - target: Bunode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.imal1.BunodeTests
        GENERATE_INFOPLIST_FILE: "YES"
