name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust tests, app build, Swift tests
    # A pull request from a branch of this repository is already covered by
    # the push run of that branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      # The integration tests start real node, bun, npm, pnpm and python3
      # processes (python3 comes with the runner).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Install tools
        run: |
          brew install xcodegen
          npm install --global pnpm@10
          rustup component add clippy rustfmt
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Show versions
        run: |
          sw_vers
          xcodebuild -version
          rustc --version
          xcodegen --version
          node --version
          bun --version
          pnpm --version

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: make lint

      - name: Rust tests
        run: make test-rust

      - name: Build app
        run: make app

      - name: Swift tests
        run: make test-app
