name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust tests, app build, Swift tests
    runs-on: macos-26
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The integration tests start real node, bun, npm, pnpm and python3
      # processes (python3 comes with the runner).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Install tools
        run: |
          brew install xcodegen
          npm install --global pnpm@10
          rustup component add clippy rustfmt
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Show versions
        run: |
          sw_vers
          xcodebuild -version
          rustc --version
          xcodegen --version
          node --version
          bun --version
          pnpm --version

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: make lint

      - name: Rust tests
        run: make test-rust

      - name: Build app
        run: make dist

      - name: Swift tests
        run: make test-app

      - name: Read version
        id: version
        run: echo "value=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Bunode-${{ steps.version.outputs.value }}-${{ github.sha }}
          path: build/Bunode-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 30
